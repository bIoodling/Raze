[package]
name = "raze-macro"
version = "1.0.0-dev"
edition = "2021"

[[bin]]
name = "Raze-Macro"
path = "src/main.rs"

[[bin]]
name = "Raze-Macro-Setup"
path = "src/setup.rs"
required-features = ["installer"]

[features]
default = ["dev-activation"]
dev-activation = []
installer = []

[dependencies.windows-sys]
version = "0.61.2"
features = [
 "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
 "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading",
 "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
