[package]
name = "hika"
version = "1.5.0-production"
edition = "2021"

[[bin]]
name = "HikaPayload"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", features = ["tls"] }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",

    "Win32_Security",

    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",

    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true